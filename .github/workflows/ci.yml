name: FulfillOps backend quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fulfillops-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Validate OpenAPI
        run: npm run validate:openapi

      - name: Test with coverage thresholds
        run: npm run test:cov -- --runInBand

      - name: Check aggregate coverage thresholds
        run: npm run coverage:check

      - name: Run isolated API tests
        run: npm run test:e2e -- --runInBand

      - name: Audit dependencies (block on moderate or higher)
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build
